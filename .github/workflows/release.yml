name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create the release for (e.g. v0.2.0); created at the dispatched ref if it does not exist"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Check tag matches package version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke

      - name: Package Agent Skill
        run: npm run package:skill

      - name: Package Claude Desktop Extension
        run: npm run package:mcpb

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — skipping publish"
          else
            npm publish
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Simplecast MCP Server ${{ inputs.tag || github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/simplecast-mcp-server.mcpb
            dist/simplecast-skill.zip
          body: |
            ## Assets

            - **`simplecast-mcp-server.mcpb`** — a one-click [Claude Desktop Extension](https://www.anthropic.com/engineering/desktop-extensions). Open it with Claude Desktop and enter your Simplecast API token when prompted.
            - **`simplecast-skill.zip`** — the Simplecast Agent Skill. Upload it in Settings → Capabilities → Skills, or unzip it into `~/.claude/skills/` for Claude Code.

            See the [README](https://github.com/philwinkle/simplecast-mcp-server#readme) for `npx`/Claude Code MCP setup instructions.
